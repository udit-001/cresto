<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; padding: 16px; font-family: system-ui, -apple-system, sans-serif; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 4px 0; }
  p { font-size: 12px; color: #666; margin: 0 0 12px 0; line-height: 1.4; }
  button { width: 100%; padding: 10px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
  .primary { background: #2563eb; color: white; }
  .primary:hover { background: #1d4ed8; }
  .primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .status { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 6px; display: none; }
  .status.ok { background: #d1fae5; color: #065f46; display: block; }
  .status.err { background: #fee2e2; color: #991b1b; display: block; }
  .hint { margin-top: 10px; font-size: 11px; color: #999; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Connect to Cresto</h1>
  <p>Sends your greytHR session to Cresto for payslip auto-fetch.</p>
  <button id="connect" class="primary">Connect</button>
  <div id="status" class="status"></div>
  <div class="hint">
    Make sure you're on a greytHR ESS page and Cresto is running at localhost:7777.
  </div>
  <script src="popup.js"></script>
</body>
</html>
